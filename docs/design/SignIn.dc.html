<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="vero.css">
<script src="vero-ui.js"></script>
<script src="vero-3d.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
.si{flex-direction:row;flex-wrap:wrap}
.si-stage{flex:1 1 560px;min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;padding:24px clamp(24px,3vw,44px) clamp(24px,3vw,44px)}
.si-stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:60%;background:linear-gradient(to top,rgba(17,16,18,.78),rgba(17,16,18,0));pointer-events:none}
.si-haze{position:absolute;inset:0;background:radial-gradient(55% 50% at 58% 52%,rgba(224,106,144,.3),rgba(224,106,144,0) 72%);opacity:0;transition:opacity .9s var(--ease);pointer-events:none}
.si:has(.input:focus) .si-haze{opacity:1}
.si-logo{position:relative;z-index:2;height:28px;align-self:flex-start;display:block}
.si-line{position:relative;z-index:2;color:#fff;font-size:clamp(46px,5.5vw,88px);line-height:.99;letter-spacing:-.042em;font-weight:600;max-width:9em}
.si-v{flex:none;width:128%;height:auto;margin-top:-6%;fill:url(#si-enamel);filter:drop-shadow(0 40px 80px rgba(214,92,130,.35));animation:si-float 9s ease-in-out infinite alternate}
@keyframes si-float{from{transform:translateY(-1.5%) rotate(-1deg)}to{transform:translateY(1.5%) rotate(1deg)}}
.si-main{flex:1 1 480px;position:relative;display:flex;align-items:center;justify-content:center;padding:clamp(72px,8vw,96px) clamp(20px,4vw,56px) clamp(32px,5vw,64px)}
[data-theme="dark"] .si-main{border-left:1px solid var(--line)}
.si-tools{position:absolute;top:18px;right:clamp(16px,2vw,32px)}
.si-form{width:100%;max-width:400px}
.si-in{animation:si-rise .8s var(--ease) backwards;animation-delay:calc(.45s + var(--n)*.09s)}
@keyframes si-rise{from{opacity:0;transform:translateY(18px)}}
.si-or{display:flex;align-items:center;gap:14px;font-size:14.5px;color:var(--ink-3)}
.si-or::before,.si-or::after{content:"";flex:1;height:1px;background:var(--line)}
.si-g{width:18px;height:18px;fill:currentColor}
@media (max-width:1040px){.si-stage{min-height:min(58vh,480px)}.si-line{font-size:clamp(40px,8vw,64px)}}
</style>
</helmet>
<div class="vs si" data-theme="{{theme}}">
  <div class="stage si-stage">
    <div data-v3d="hero" data-framing="bleed" aria-hidden="true" style="position:absolute;inset:0">
      <div class="v3d-fallback"><svg class="si-v" viewBox="0 0 132 100"><defs><linearGradient id="si-enamel" x1="0" y1="0" x2=".55" y2="1"><stop offset="0" stop-color="#F08AA8"></stop><stop offset=".55" stop-color="#E06A90"></stop><stop offset="1" stop-color="#B03C64"></stop></linearGradient></defs><path d="M14.7 0H51L35 26.5C31 32 26 35 19 35 8 35 0 27 0 17 0 8 6 2 14.7 0ZM97 0h35L74 92.6c-3.5 4.9-8.5 7.4-14 7.4-6 0-11.5-3-15-7.5L22.4 58.4C27 61.5 31.5 64 37.6 64c6.4 0 11.4-2.5 14.9-7.5L84 7c3-4 8-7 13-7Z"></path></svg></div>
    </div>
    <div class="si-haze"></div>
    <img class="si-logo" src="vero-lockup-dark.svg" alt="Vero Scan">
    <p class="si-line" data-blurin="0.3">Know exactly where your company stands.</p>
  </div>

  <main class="si-main">
    <div class="tools si-tools"><button class="iconbtn" type="button" data-theme-toggle aria-label="Switch between light and dark"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></button></div>
    <div class="stack g32 si-form">
      <div class="stack g8 si-in" style="--n:0">
        <h1 class="t-1">Get your legal health score</h1>
        <p class="quiet">It takes a few minutes. No documents needed to start.</p>
      </div>
      <form class="stack g16" action="FindCompany.dc.html">
        <a class="btn btn-line si-in" style="--n:1;width:100%" href="FindCompany.dc.html"><svg class="si-g" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.35 11.1H12v2.98h5.35c-.23 1.4-1.64 4.1-5.35 4.1-3.22 0-5.85-2.67-5.85-5.96S8.78 6.26 12 6.26c1.83 0 3.06.78 3.76 1.45l2.57-2.47C16.68 3.7 14.55 2.8 12 2.8 6.92 2.8 2.8 6.92 2.8 12s4.12 9.2 9.2 9.2c6.93 0 9.2-4.86 9.2-7.36 0-1.03-.05-1.74-.15-2.74Z"></path></svg>Continue with Google</a>
        <p class="si-or si-in" style="--n:2">or</p>
        <div class="field si-in" style="--n:3">
          <label for="email">Work email</label>
          <input class="input" id="email" type="email" value="amara@kestrelpay.co">
        </div>
        <a class="btn btn-ink si-in" style="--n:4;width:100%" href="FindCompany.dc.html">Continue</a>
      </form>
      <p class="small si-in" style="--n:5">We'll email you a sign-in link, so there's no password to remember. By continuing you accept our <a class="link" href="Settings.dc.html">terms</a> and <a class="link" href="Settings.dc.html">privacy policy</a>.</p>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic { renderVals(){ return { theme: this.props.theme ?? 'light' }; } }
</script>
</body>
</html>
